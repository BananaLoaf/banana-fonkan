name: Python CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-ci:
    uses: BananaLoaf/ci-cd/.github/workflows/python-ci.yml@master
    with:
      mypy-options: banana_fonkan/

  python-build:
    uses: BananaLoaf/ci-cd/.github/workflows/python-build.yml@master
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.base_ref == 'master'
    name: python-build
    needs: python-ci
    with:
      cibuildwheel: false

